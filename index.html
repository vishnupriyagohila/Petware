                  <img src={quickViewProduct.images[quickViewProduct.defaultColor]} alt={quickViewProduct.name} className="w-full aspect-square rounded-2xl object-cover" />
                  <div className="space-y-3">
                    <span className="text-[10px] font-mono uppercase tracking-widest text-[#C86D51]">{quickViewProduct.category} atelier</span>
                    <h3 className="font-serif text-2xl text-[#1E1E1E]">{quickViewProduct.name}</h3>
                    <p className="font-mono text-xl font-bold text-[#1E1E1E]">₹{quickViewProduct.price}</p>
                    <p className="text-xs text-[#3E2F28]/80 leading-relaxed">{quickViewProduct.description}</p>
                    <div className="border-t border-[#E7DDD3] pt-3 text-[11px] space-y-1 font-mono text-[#3E2F28]/70">
                      <p><strong>Materials:</strong> {quickViewProduct.materials}</p>
                      <p><strong>Dimensions:</strong> {quickViewProduct.dimensions}</p>
                    </div>
                    <button onClick={() => { toggleWishlist(quickViewProduct.id); setQuickViewProduct(null); }} className="w-full mt-4 py-3 rounded-full bg-[#3E2F28] hover:bg-[#1E1E1E] text-white text-xs uppercase tracking-widest font-semibold transition-all">
                      {wishlist.includes(quickViewProduct.id) ? "Remove From Shortlist" : "Save To Shortlist"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#3E2F28] text-white px-5 py-3 rounded-full text-xs font-mono shadow-2xl flex items-center gap-2 border border-white/20">
              <span className="w-2 h-2 rounded-full bg-[#8E9A82]"></span>
              <span>{toastMessage}</span>
            </div>
          )}

          <footer className="bg-[#3E2F28] text-[#F3ECE2] py-16 border-t border-white/10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center sm:text-left">
              <div className="flex flex-col sm:flex-row justify-between items-center border-b border-white/10 pb-8 mb-8 gap-4">
                <div>
                  <span className="font-serif text-2xl tracking-[0.25em] font-bold text-white block">PAWÉRA</span>
                  <p className="font-serif italic text-xs text-white/60">“Everyday essentials, beautifully made for them.”</p>
                </div>
                <div className="flex gap-6 text-xs uppercase tracking-widest font-mono text-white/70">
                  <a href="#collection" className="hover:text-white">Collection</a>
                  <a href="#ritual" className="hover:text-white">Ritual</a>
                  <a href="#kit-builder" className="hover:text-white">Kit</a>
                  <a href="#bespoke" className="hover:text-white">Bespoke</a>
                </div>
              </div>
              <p className="text-[11px] font-mono text-white/40 text-center">© 2026 PAWÉRA Atelier. All rights reserved. Handcrafted for modern sanctuaries.</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
